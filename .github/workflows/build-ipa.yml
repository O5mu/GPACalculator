name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    env:
      HAS_SIGNING: ${{ secrets.P12_BASE64 != '' && secrets.PROVISIONING_PROFILE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Always produced: proves the app compiles and gives an IPA you can sign yourself.
      - name: Build unsigned IPA
        run: |
          set -eo pipefail
          xcodebuild build \
            -project GPACalculator.xcodeproj \
            -scheme GPACalculator \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/unsigned \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | xcbeautify --renderer github-actions
          mkdir -p build/payload/Payload
          cp -R build/unsigned/Build/Products/Release-iphoneos/GPACalculator.app build/payload/Payload/
          (cd build/payload && zip -qry ../GPACalculator-unsigned.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: GPACalculator-unsigned
          path: build/GPACalculator-unsigned.ipa

      # Only runs when the signing secrets are set in the repository settings.
      - name: Install certificate and profile
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -eo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(plutil -extract UUID raw "$RUNNER_TEMP/profile.plist")
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/$UUID.mobileprovision"
          done

          TEAM_ID=$(plutil -extract TeamIdentifier.0 raw "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(plutil -extract Name raw "$RUNNER_TEMP/profile.plist")
          APP_ID=$(plutil -extract Entitlements.application-identifier raw "$RUNNER_TEMP/profile.plist")
          BUNDLE_ID="${APP_ID#"$TEAM_ID".}"
          if [[ "$BUNDLE_ID" == *"*"* ]]; then BUNDLE_ID="com.osama.GPACalculator"; fi

          # Pick the export method from the profile type.
          if plutil -extract ProvisionsAllDevices raw "$RUNNER_TEMP/profile.plist" > /dev/null 2>&1; then
            METHOD="enterprise"; IDENTITY="Apple Distribution"
          elif plutil -extract ProvisionedDevices raw "$RUNNER_TEMP/profile.plist" > /dev/null 2>&1; then
            if [ "$(plutil -extract Entitlements.get-task-allow raw "$RUNNER_TEMP/profile.plist" 2>/dev/null)" = "true" ]; then
              METHOD="debugging"; IDENTITY="Apple Development"
            else
              METHOD="release-testing"; IDENTITY="Apple Distribution"
            fi
          else
            METHOD="app-store-connect"; IDENTITY="Apple Distribution"
          fi

          echo "Signing $BUNDLE_ID for team $TEAM_ID with profile '$PROFILE_NAME' ($METHOD)"
          {
            echo "TEAM_ID=$TEAM_ID"
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "BUNDLE_ID=$BUNDLE_ID"
            echo "METHOD=$METHOD"
            echo "IDENTITY=$IDENTITY"
          } >> "$GITHUB_ENV"

      - name: Build signed IPA
        if: env.HAS_SIGNING == 'true'
        run: |
          set -eo pipefail
          xcodebuild archive \
            -project GPACalculator.xcodeproj \
            -scheme GPACalculator \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/GPACalculator.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            | xcbeautify --renderer github-actions

          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>$METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$IDENTITY</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/GPACalculator.xcarchive \
            -exportPath build/signed \
            -exportOptionsPlist build/ExportOptions.plist

      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING == 'true'
        with:
          name: GPACalculator-signed
          path: build/signed/*.ipa

      - name: Clean up keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
